name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU-only PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,plots]"

      - name: Lint (ruff)
        run: python -m ruff check src tests scripts

      - name: Test (pytest)
        run: python -m pytest

  typecheck:
    name: typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 3.12+: the numpy stubs that ship with torch use PEP 695 syntax,
          # which mypy will not parse under an earlier target.
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,plots]"

      - name: Type-check
        run: python -m mypy

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only PyTorch and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,plots]"

      - name: Train a tiny model and serve it
        run: |
          python scripts/train.py --preset draft --steps 40 --out /tmp/ci
          python - <<'EOF'
          import torch
          from microserve.config import CacheConfig, EngineConfig, SamplingConfig
          from microserve.engine import LLMEngine
          from microserve.model import Transformer
          from microserve.tokenizer import CharTokenizer

          torch.set_num_threads(1)
          model = Transformer.from_checkpoint("/tmp/ci/draft.pt")
          tok = CharTokenizer.from_file("/tmp/ci/tokenizer.json")
          engine = LLMEngine(
              model,
              EngineConfig(model=model.cfg, cache=CacheConfig(block_size=16, num_blocks=128)),
              tokenizer=tok,
          )
          out = engine.generate(["ROMEO:"], SamplingConfig(temperature=0.8, max_new_tokens=64, seed=0))
          assert len(out[0].output_ids) == 64, out[0].output_ids
          assert engine.cache.num_free_blocks == 128, "cache blocks leaked"
          print(out[0].text)
          EOF
